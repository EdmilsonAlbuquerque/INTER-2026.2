# Banco local persistente para desenvolvimento, sem servidor externo.
spring.datasource.url=jdbc:h2:file:./data/agendamento;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
app.financeiro.dados-exemplo=true
