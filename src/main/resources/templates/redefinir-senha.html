<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — Instituto Manancial</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link rel="stylesheet" href="/css/acessibilidade.css"><script src="/js/formularios.js" defer></script><script src="/js/acessibilidade-visual.js" defer></script></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6">
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a><main class="bg-white rounded-2xl shadow-sm p-8 w-full max-w-md" id="conteudo-principal" tabindex="-1"><h1 class="text-2xl font-bold">Definir nova senha</h1><p class="text-sm text-slate-500 mt-2 mb-6">Instituto Manancial</p><form id="redefinir-form" class="space-y-4"><label class="block text-sm">Nova senha<input name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required class="mt-1 w-full rounded-lg border-slate-200" id="nova-senha" data-password="nova" data-hint="Use pelo menos 8 caracteres e no máximo 72 bytes."></label><label class="block text-sm">Confirmar senha<input name="confirmacao" type="password" autocomplete="new-password" minlength="8" maxlength="72" required class="mt-1 w-full rounded-lg border-slate-200" data-matches="#nova-senha" data-hint="Repita a senha informada acima."></label><button type="submit" class="w-full rounded-lg bg-blue-800 text-white p-3 font-semibold">Salvar nova senha</button></form><a class="block mt-5 text-sm text-blue-800" href="/login">Voltar ao login</a></main><script src="/js/acesso.js" defer></script></body></html>
