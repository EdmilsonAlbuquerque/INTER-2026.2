<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços — Instituto Manancial</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="/css/aplicacao.css" rel="stylesheet"></head>
<body class="bg-slate-50 text-slate-800" style="font-family:Inter,sans-serif"><header class="fixed top-0 w-full z-40 bg-white shadow-sm"><div class="max-w-7xl mx-auto p-4 flex items-center justify-between gap-4"><a href="/gerenciamento" class="font-bold text-blue-900">Instituto Manancial</a><nav class="flex gap-4"><a href="/gerenciamento">Gerenciamento</a><a href="/servicos" aria-current="page" class="text-blue-800 font-semibold">Serviços</a><a href="/meu-perfil">Meu perfil</a></nav></div></header>
<main class="max-w-7xl mx-auto px-6 pb-12 space-y-6" id="servicos-panel"><div class="pt-8 flex flex-wrap gap-4 items-center justify-between"><div><h1 class="text-2xl font-bold">Gerenciamento de serviços</h1><p class="text-slate-500 text-sm mt-2">Programas e serviços cadastrados no Instituto.</p></div><div class="flex gap-3"><button id="relatorio-servicos" class="bg-white border rounded-lg px-4 py-2">Exportar relatório</button><button id="novo-servico" hidden class="bg-blue-800 text-white rounded-lg px-4 py-2">Novo serviço</button></div></div>
<div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap gap-4"><input id="busca-servico" aria-label="Buscar serviço" class="campo flex-1" placeholder="Buscar por nome ou categoria"><select id="status-servico" aria-label="Situação" class="campo" style="width:auto"><option value="">Todos os serviços</option><option value="true">Ativos</option><option value="false">Inativos</option></select><button id="limpar-servico">Limpar filtros</button></div>
<p id="servicos-contagem" role="status" class="text-sm text-slate-500"></p><div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-4">Serviço</th><th class="p-4">Categoria</th><th class="p-4">Responsável</th><th class="p-4">Duração</th><th class="p-4">Situação</th><th class="p-4">Ações</th></tr></thead><tbody id="servicos-lista"></tbody></table></div></main>
<dialog id="servico-modal"><form id="servico-form" class="space-y-4"><h2 id="servico-titulo" class="text-xl font-semibold">Novo serviço</h2><input type="hidden" name="id"><label class="block">Nome<input class="campo" name="nome" maxlength="150" required></label><label class="block">Categoria<input class="campo" name="categoria" maxlength="100"></label><label class="block">Descrição<textarea class="campo" name="descricao" maxlength="500"></textarea></label><label class="block">Duração (minutos)<input class="campo" name="duracaoMinutos" type="number" min="1" step="1"></label><label class="block">Responsável<select class="campo" name="responsavelId" required></select></label><button type="button" id="novo-responsavel" class="text-blue-800 text-sm">Cadastrar responsável</button><label class="block"><input type="checkbox" name="ativo" checked> Serviço ativo</label><div class="flex justify-end gap-4"><button type="button" data-close>Cancelar</button><button type="submit" class="bg-blue-800 text-white rounded-lg px-4 py-2">Salvar serviço</button></div></form></dialog>
<dialog id="responsavel-modal"><form id="responsavel-form" class="space-y-4"><h2 class="text-xl font-semibold">Novo responsável</h2><label class="block">Nome<input name="nome" class="campo" required maxlength="150"></label><label class="block">E-mail<input name="email" class="campo" type="email" required maxlength="150"></label><label class="block">Telefone<input name="telefone" class="campo" type="tel" maxlength="20"></label><div class="flex gap-4 justify-end"><button type="button" data-close>Cancelar</button><button type="submit" class="bg-blue-800 text-white rounded-lg px-4 py-2">Salvar responsável</button></div></form></dialog>
<script src="/js/acesso.js" defer></script><script src="/js/interface.js" defer></script><script src="/js/servicos.js" defer></script></body></html>
